name: Credential logging regressions

on:
  push:
    branches: [main]
    paths:
      - 'api/**'
      - 'management/server/services/knowledgebases/**'
      - '.github/workflows/credential-logging.yml'
  pull_request:
    paths:
      - 'api/**'
      - 'management/server/services/knowledgebases/**'
      - '.github/workflows/credential-logging.yml'

permissions:
  contents: read

jobs:
  credential-logging:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run isolated credential logging regressions
        run: python -m unittest discover -s api/tests -v
