name: Docker logging configuration

on:
  push:
    branches: [main]
    paths: ['docker/**', '.github/workflows/docker-logging.yml']
  pull_request:
    paths: ['docker/**', '.github/workflows/docker-logging.yml']

permissions:
  contents: read

jobs:
  logging:
    runs-on: ubuntu-latest
    env:
      MANAGEMENT_ADMIN_PASSWORD: test-only-password-123456
      MANAGEMENT_JWT_SECRET: test-only-secret-at-least-32-bytes-long
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install PyYAML==6.0.3
      - run: python -m unittest discover -s docker/tests -v
      - name: Validate CPU and GPU Compose configurations
        working-directory: docker
        run: |
          docker compose -f docker-compose.yml config --quiet
          docker compose -f docker-compose_gpu.yml config --quiet
