name: Database connection lifecycle

on:
  push:
    branches: [main]
    paths:
      - 'api/db/**'
      - 'api/apps/**'
      - '.github/workflows/database-lifecycle.yml'
  pull_request:
    paths:
      - 'api/db/**'
      - 'api/apps/**'
      - '.github/workflows/database-lifecycle.yml'

permissions:
  contents: read

jobs:
  database-lifecycle:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install lifecycle test dependencies
        run: python -m pip install Flask==3.0.3 peewee==3.17.1
      - name: Run database lifecycle regressions
        run: python -m unittest discover -s api/db/tests -v
