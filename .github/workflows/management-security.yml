name: Management security regression tests

on:
  push:
    branches: [main]
    paths:
      - 'management/**'
      - 'docker/**'
      - '.github/workflows/management-security.yml'
  pull_request:
    paths:
      - 'management/**'
      - 'docker/**'
      - '.github/workflows/management-security.yml'

permissions:
  contents: read

jobs:
  management-security:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install security test dependencies
        run: python -m pip install Flask==3.0.3 flask-cors==5.0.0 PyJWT==2.10.1 python-dotenv==1.0.1
      - name: Run management security regressions
        run: python -m unittest discover -s management/server/tests -v

  management-web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: management/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pnpm
        run: npm install --global pnpm@9.15.9
      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Run frontend tests
        run: pnpm exec vitest run
      - name: Build management frontend
        run: pnpm build
